name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Versions
        run: |
          dart --version
          flutter --version

      - name: Pub get (core + server + app)
        run: |
          cd packages/core && dart pub get
          cd ../../server && dart pub get
          cd ../app && flutter pub get

      - name: Analyze (fatal infos)
        run: |
          cd packages/core && dart analyze --fatal-infos
          cd ../../server && dart analyze --fatal-infos
          cd ../app && flutter analyze --no-pub

      - name: Migrate ci branch (idempotent)
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          cd server && dart run tool/migrate.dart --dir ../db/migrations

      - name: Tests (core + server + widgets)
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          cd packages/core && dart test
          cd ../../server && dart test
          cd ../app && flutter test

      - name: Core coverage gate (>=80% lines)
        run: |
          cd packages/core
          dart test --coverage=coverage
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o coverage/lcov.info -i coverage
          total=$(grep -c '^DA:' coverage/lcov.info)
          hit=$(grep '^DA:' coverage/lcov.info | awk -F'[,:]' '$3 > 0' | wc -l)
          pct=$((100 * hit / total))
          echo "core line coverage: $hit/$total ($pct%)"
          [ "$pct" -ge 80 ]

      - name: Evals (scripted, no LLM)
        run: |
          cd server && dart run tool/evals.dart --dir ../evals/fixtures

      - name: Build web (smoke)
        run: |
          cd app && flutter build web --no-pub

      - name: Secrets guard (no keys in git)
        run: |
          ! grep -rE "npg_[A-Za-z0-9]+" --exclude-dir=.git --exclude-dir=node_modules --exclude=PLAN.md . || (echo "secret leaked into git" && exit 1)
